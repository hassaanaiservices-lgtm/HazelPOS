# Builds the HazelPOS Windows installer and publishes it to the PUBLIC releases repo (hassaanaiservices-lgtm/HazelPOS-releases),
# where installed apps look for updates. The code repo can stay private.
#
# One-time setup (desktop/README.md): create the empty public repo "HazelPOS-releases", make a fine-grained token that can
# write Contents on that repo only, and save it in THIS repo: Settings → Secrets and variables → Actions → RELEASES_TOKEN.
#
# Release: bump "version" in desktop/package.json, commit, then   git tag v1.0.1 && git push --tags
# Only Windows: it is built on a Windows runner because server/node_modules has Windows-specific parts (sharp).
name: Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag must match the version in desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match desktop/package.json version $V"; exit 1; }
      - run: npm --prefix desktop install
      - run: npm --prefix desktop run prepare-app
      - name: Check the pieces (cloud address, licence key, working Windows sharp)
        run: node desktop/verify-build.js pre
      - name: Build the installer (not published yet)
        run: npx electron-builder --win --publish never
        working-directory: desktop
      - name: Check the installer
        run: node desktop/verify-build.js post
      - uses: actions/upload-artifact@v4
        with:
          name: HazelPOS-installer
          path: |
            desktop/dist/HazelPOS-Setup-*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
      - name: Publish to the public releases repo
        run: npx electron-builder --win --prepackaged dist/win-unpacked --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
