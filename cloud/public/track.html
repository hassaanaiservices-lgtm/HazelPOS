<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14161a">
<title>Where is my order?</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  /* The customer's tracking page: sent by WhatsApp when the order leaves. Order status, and the rider on a map while on the way. */
  :root { --bg: #14161a; --surface: #1e2127; --outline: #3a3f49; --text: #f2f3f5; --muted: #a1a7b3; --accent: #ff7a1a; --ok: #3ddc84; --warn: #ffb020; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; } .muted { color: var(--muted); } .small { font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--outline); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .status { font-size: 20px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
  .status.out { color: var(--accent); } .status.delivered { color: var(--ok); } .status.cooking, .status.ready { color: var(--warn); }
  #map { height: 360px; border-radius: 14px; border: 1px solid var(--outline); margin-top: 12px; display: none; background: #22262d; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
  .step { font-size: 12px; color: var(--muted); text-align: center; padding-top: 8px; border-top: 3px solid var(--outline); }
  .step.done { border-color: var(--ok); color: var(--text); } .step.now { border-color: var(--accent); color: var(--text); font-weight: 700; }
  .rider-marker { background: var(--accent); color: #14161a; border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; font-size: 20px; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .home-marker { background: var(--ok); color: #14161a; border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-size: 16px; border: 2px solid #fff; }
  .leaflet-container { font: inherit; }
</style>
</head>
<body>
  <h1 id="title">Your order</h1>
  <div class="muted small" id="restaurant"></div>
  <div class="card">
    <div class="status" id="status">Loading…</div>
    <div class="muted" id="detail"></div>
    <div class="steps"><div class="step" id="s1">Preparing</div><div class="step" id="s2">On the way</div><div class="step" id="s3">Delivered</div></div>
  </div>
  <div id="map"></div>
  <div class="card small muted" id="items"></div>
  <p class="muted small">Powered by HazelPOS. The rider's location is shown only while your order is on the way.</p>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(() => {
  const token = location.pathname.split('/').pop();
  const $ = id => document.getElementById(id);
  const rs = n => 'Rs ' + Math.round(+n || 0).toLocaleString('en-PK');
  const mins = iso => iso ? Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000)) : 0;
  const km = (a, b) => { const R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
  let map, rider, home, trail = [], line;
  const showMap = (r, c) => {
    const el = $('map'); el.style.display = 'block';
    if (!map) {
      map = L.map('map', { zoomControl: true }).setView([r.lat, r.lng], 15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
      rider = L.marker([r.lat, r.lng], { icon: L.divIcon({ className: '', html: '<div class="rider-marker">🛵</div>', iconSize: [36, 36], iconAnchor: [18, 18] }) }).addTo(map);
      if (c) home = L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', html: '<div class="home-marker">🏠</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map);
      line = L.polyline([], { color: '#ff7a1a', weight: 3, opacity: .6 }).addTo(map);
      if (c) map.fitBounds([[r.lat, r.lng], [c.lat, c.lng]], { padding: [40, 40] });
    } else rider.setLatLng([r.lat, r.lng]);
    const last = trail[trail.length - 1];
    if (!last || last[0] !== r.lat || last[1] !== r.lng) { trail.push([r.lat, r.lng]); line.setLatLngs(trail); }
  };
  async function load() {
    let d;
    try { const res = await fetch('/api/track/' + token); d = await res.json(); if (!res.ok) throw new Error(d.error); }
    catch (e) { $('status').textContent = e.message || 'Could not load'; $('status').className = 'status'; return; }
    $('title').textContent = `Order #${d.order}`; $('restaurant').textContent = 'from ' + d.restaurant; document.title = `Order #${d.order} · ${d.restaurant}`;
    $('items').textContent = d.items + (d.total ? ` · ${d.cod ? 'Pay the rider ' : 'Paid '}${rs(d.total)}` : '');
    const st = $('status'); st.className = 'status ' + d.status;
    ['s1', 's2', 's3'].forEach(id => $(id).className = 'step');
    if (d.status === 'delivered') { st.textContent = '✅ Delivered'; $('detail').textContent = `${mins(d.delivered_at)} min ago. Enjoy your meal!`; ['s1', 's2', 's3'].forEach(id => $(id).classList.add('done')); $('map').style.display = 'none'; return; }
    if (d.status === 'out') {
      $('s1').classList.add('done'); $('s2').classList.add('now');
      st.textContent = `🛵 On the way${d.rider ? ' with ' + d.rider.name : ''}`;
      let detail = `Left ${mins(d.dispatched_at)} min ago.`;
      if (d.rider && d.rider.lat != null) {
        const age = Math.round((Date.now() - Date.parse(d.rider.at)) / 1000);
        if (d.customer) { const dist = km(d.rider, d.customer); detail += ` About ${dist < 1 ? Math.round(dist * 1000) + ' m' : dist.toFixed(1) + ' km'} away (~${Math.max(1, Math.round(dist / 20 * 60 + 2))} min).`; }
        detail += age > 120 ? ` Rider's location is ${Math.round(age / 60)} min old.` : '';
        showMap(d.rider, d.customer);
      } else detail += " The rider's location isn't available right now.";
      $('detail').textContent = detail; return;
    }
    $('s1').classList.add('now');
    st.textContent = d.status === 'ready' ? '👨‍🍳 Packed, rider leaving soon' : '👨‍🍳 Being prepared';
    $('detail').textContent = 'This page updates by itself.';
  }
  load(); setInterval(load, 10000);
})();
</script>
</body>
</html>
