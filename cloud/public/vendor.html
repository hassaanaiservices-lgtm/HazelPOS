<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HazelPOS Vendor</title>
<style>
  :root { --bg: #0f1117; --panel: #181b24; --panel2: #20242f; --line: #2b3040; --text: #eef0f6; --muted: #8b91a5; --accent: #ff6b35; --accent2: #ffb347; --green: #2ecc8f; --red: #ff5470; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: #111; font-weight: 700; }
  button.danger { border-color: var(--red); color: var(--red); }
  input, textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header b { font-size: 18px; } header .sp { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .muted { color: var(--muted); } .err { color: var(--red); min-height: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0; font-size: 17px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; } .head .sp { flex: 1; }
  .pill { border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
  .pill.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .pill.due { background: color-mix(in srgb, var(--accent2) 18%, transparent); color: var(--accent2); }
  .pill.off { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .kpi span { color: var(--muted); font-size: 13px; display: block; } .kpi b { font-size: 22px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; } th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; } .scroll { overflow-x: auto; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .form .wide { grid-column: 1 / -1; }
  .auth { max-width: 380px; margin: 10vh auto; } .auth input { margin-bottom: 10px; } .auth button { width: 100%; }
  .key { font-family: monospace; background: var(--panel2); padding: 10px; border-radius: 8px; word-break: break-all; user-select: all; margin: 8px 0; }
  @media (max-width: 700px) { .form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const ago = iso => { if (!iso) return 'never'; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago' }
const today = () => new Date().toISOString().slice(0, 10)
const daysTo = d => Math.floor((Date.parse(d + 'T23:59:59Z') - Date.now()) / 864e5)
let token = sessionStorage.getItem('vendor_token'), newKey = null

async function api(url, body) {
  const r = await fetch('/api/vendor' + url, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (token || '') }, body: body && JSON.stringify(body) })
  const data = await r.json().catch(() => ({}))
  if (r.status === 401 && url !== '/login') { token = null; sessionStorage.removeItem('vendor_token'); render(); throw new Error('Please log in again') }
  if (!r.ok) throw new Error(data.error || 'Request failed')
  return data
}

function loginView() {
  $('#app').innerHTML = `<div class="auth card"><h2>HazelPOS vendor</h2><p class="muted">Restaurants, memberships and AI usage</p>
    <input id="pass" type="password" placeholder="Vendor password" autocomplete="current-password"><div class="err" id="err"></div>
    <button class="primary" id="go">Log in</button></div>`
  const go = async () => { try { token = (await api('/login', { password: $('#pass').value })).token; sessionStorage.setItem('vendor_token', token); render() } catch (e) { $('#err').textContent = e.message } }
  $('#go').onclick = go; $('#pass').onkeydown = e => e.key === 'Enter' && go()
}

function status(o) {
  if (o.suspended) return '<span class="pill off">Suspended</span>'
  if (!o.paid_until) return '<span class="pill off">Not paid</span>'
  const d = daysTo(o.paid_until)
  if (d < 0) return `<span class="pill off">Ended ${-d} day(s) ago</span>`
  if (d < 5) return `<span class="pill due">Due in ${d} day(s)</span>`
  return '<span class="pill ok">Active</span>'
}

async function render() {
  if (!token) return loginView()
  let owners
  try { owners = await api('/owners') } catch (e) { return }
  const all = owners.flatMap(o => o.branches)
  const sum = k => all.reduce((s, b) => s + (b.ai[k] || 0), 0)
  $('#app').innerHTML = `<header><b>HazelPOS vendor</b><span class="sp"></span><button id="logout">Log out</button></header><main>
    <div class="kpis">
      <div class="kpi"><span>Restaurants</span><b>${owners.length}</b></div>
      <div class="kpi"><span>Active memberships</span><b>${owners.filter(o => o.active).length}</b></div>
      <div class="kpi"><span>AI replies this month</span><b>${all.reduce((s, b) => s + b.ai.calls, 0).toLocaleString()}</b></div>
      <div class="kpi"><span>Tokens in / out</span><b>${(sum('tokens_in') / 1e6).toFixed(2)}M / ${(sum('tokens_out') / 1e6).toFixed(2)}M</b></div>
      <div class="kpi"><span>Voice notes (min)</span><b>${Math.round(sum('audio_seconds') / 60)}</b></div>
    </div>
    ${newKey ? `<div class="card"><h3>Branch key for ${esc(newKey.name)}</h3><p class="muted">Shown once. Type it into the restaurant's activation screen together with this cloud's address: <b>${esc(location.origin)}</b></p><div class="key">${esc(newKey.key)}</div><button id="keydone">I've copied it</button></div>` : ''}
    <details class="card" ${owners.length ? '' : 'open'}><summary><b>Add a restaurant</b></summary>
      <div class="form" style="margin-top:12px">
        <input id="n-name" placeholder="Restaurant name"><input id="n-phone" placeholder="Owner phone">
        <input id="n-email" type="email" placeholder="Owner email (cloud dashboard login)"><input id="n-pass" type="text" placeholder="Dashboard password (8+ characters)">
        <input id="n-plan" placeholder="Plan, e.g. Rs 5,000 / month"><input id="n-paid" type="date" value="" title="Paid until (empty = one month from today)">
        <textarea id="n-notes" class="wide" rows="2" placeholder="Notes"></textarea>
        <div class="wide"><div class="err" id="n-err"></div><button class="primary" id="n-go">Add restaurant</button></div>
      </div></details>
    ${owners.map(o => `<div class="card">
      <div class="head"><h3>${esc(o.name || o.email)}</h3>${status(o)}<span class="sp"></span>
        <span class="muted">Paid until <b>${esc(o.paid_until || '—')}</b></span></div>
      <div class="muted">${esc(o.email)}${o.phone ? ' · ' + esc(o.phone) : ''}${o.plan ? ' · ' + esc(o.plan) : ''}${o.notes ? ' · ' + esc(o.notes) : ''}</div>
      <div class="scroll"><table><tr><th>Branch</th><th>Last seen</th><th>AI replies</th><th>Tokens in / out</th><th>Voice min</th><th>Failed</th><th></th></tr>
        ${o.branches.map(b => `<tr><td>${esc(b.name)}</td><td>${ago(b.last_sync)}</td><td>${b.ai.calls}</td>
          <td>${b.ai.tokens_in.toLocaleString()} / ${b.ai.tokens_out.toLocaleString()}</td><td>${Math.round(b.ai.audio_seconds / 60)}</td><td>${b.ai.failed}</td>
          <td><button data-rekey="${b.id}">New key</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No branch yet: add one to get the activation key</td></tr>'}
      </table></div>
      <div class="row">
        <button class="primary" data-extend="${o.id}" data-m="1">Paid: +1 month</button>
        <button data-extend="${o.id}" data-m="3">+3 months</button>
        <button data-date="${o.id}" data-cur="${esc(o.paid_until || today())}">Set date</button>
        <button data-branch="${o.id}">Add branch</button>
        <button class="${o.suspended ? '' : 'danger'}" data-suspend="${o.id}" data-v="${o.suspended ? 0 : 1}">${o.suspended ? 'Resume' : 'Suspend'}</button>
      </div></div>`).join('')}
  </main>`
  const act = fn => async e => { try { await fn(e.currentTarget.dataset); render() } catch (err) { alertBox(err.message) } }
  $('#logout').onclick = () => { token = null; sessionStorage.removeItem('vendor_token'); render() }
  if ($('#keydone')) $('#keydone').onclick = () => { newKey = null; render() }
  $('#n-go').onclick = async () => {
    try {
      await api('/owners', { name: $('#n-name').value, phone: $('#n-phone').value, email: $('#n-email').value, password: $('#n-pass').value, plan: $('#n-plan').value, paid_until: $('#n-paid').value, notes: $('#n-notes').value })
      render()
    } catch (e) { $('#n-err').textContent = e.message }
  }
  document.querySelectorAll('[data-extend]').forEach(b => b.onclick = act(d => api(`/owners/${d.extend}/extend`, { months: +d.m })))
  document.querySelectorAll('[data-suspend]').forEach(b => b.onclick = act(d => api(`/owners/${d.suspend}`, { suspended: d.v === '1' })))
  document.querySelectorAll('[data-branch]').forEach(b => b.onclick = act(async d => { newKey = await api(`/owners/${d.branch}/branches`, { name: 'Main branch' }) }))
  document.querySelectorAll('[data-rekey]').forEach(b => b.onclick = act(async d => { newKey = await api(`/branches/${d.rekey}/rekey`, {}) }))
  document.querySelectorAll('[data-date]').forEach(b => b.onclick = () => dateBox(b.dataset.cur, async v => { await api(`/owners/${b.dataset.date}`, { paid_until: v }); render() }))
}

// Small in-page boxes instead of the browser's alert/prompt
function alertBox(msg) { const d = document.createElement('dialog'); d.className = 'card'; d.innerHTML = `<p>${esc(msg)}</p><button>OK</button>`; document.body.append(d); d.querySelector('button').onclick = () => d.remove(); d.showModal() }
function dateBox(cur, done) {
  const d = document.createElement('dialog'); d.className = 'card'
  d.innerHTML = `<p>Paid until</p><input type="date" value="${esc(cur)}"><div class="err"></div><div class="row"><button class="primary">Save</button><button>Cancel</button></div>`
  document.body.append(d)
  const [save, cancel] = d.querySelectorAll('button')
  cancel.onclick = () => d.remove()
  save.onclick = async () => { try { await done(d.querySelector('input').value); d.remove() } catch (e) { d.querySelector('.err').textContent = e.message } }
  d.showModal()
}
render()
</script>
</body>
</html>
