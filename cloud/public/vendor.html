<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HazelPOS Admin</title>
<style>
  :root { --bg: #0f1117; --panel: #181b24; --panel2: #20242f; --line: #2b3040; --text: #eef0f6; --muted: #8b91a5; --accent: #ff6b35; --accent2: #ffb347; --green: #2ecc8f; --red: #ff5470; --blue: #6aa8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button, .btn { cursor: pointer; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 14px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
  button.primary, .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: #111; font-weight: 700; }
  button.danger { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, textarea, select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }
  textarea { font-family: ui-monospace, monospace; font-size: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; flex-wrap: wrap; }
  header b { font-size: 18px; } .sp { flex: 1; }
  main { max-width: 1150px; margin: 0 auto; padding: 16px; }
  h2 { margin: 4px 0 14px; } h3 { margin: 0 0 10px; font-size: 16px; }
  .muted { color: var(--muted); } .err { color: var(--red); min-height: 20px; } .ok-t { color: var(--green); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .pill { border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; display: inline-block; }
  .pill.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .pill.due { background: color-mix(in srgb, var(--accent2) 18%, transparent); color: var(--accent2); }
  .pill.off { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
  .pill.info { background: color-mix(in srgb, var(--blue) 18%, transparent); color: var(--blue); }
  .pill.grey { background: var(--panel2); color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .kpi span { color: var(--muted); font-size: 13px; display: block; } .kpi b { font-size: 22px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; } th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; } .scroll { overflow-x: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .wide { grid-column: 1 / -1; }
  .checks { display: flex; gap: 6px; flex-wrap: wrap; }
  .auth { max-width: 380px; margin: 10vh auto; } .auth input { margin-bottom: 10px; } .auth button { width: 100%; justify-content: center; }
  .code { font: 700 28px ui-monospace, monospace; letter-spacing: .08em; background: var(--panel2); padding: 14px 18px; border-radius: 10px; user-select: all; display: inline-block; margin: 8px 0; }
  .pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .pics figure { margin: 0; background: var(--panel2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .pics img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; }
  .errlist { max-height: 320px; overflow: auto; font: 13px ui-monospace, monospace; white-space: pre-wrap; }
  .errlist div { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .staff-row { display: grid; grid-template-columns: 2fr 1.3fr 1fr auto; gap: 8px; margin-bottom: 8px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; max-width: 92vw; }
  dialog::backdrop { background: rgb(0 0 0 / .6); }
  @media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } .staff-row { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s)
const $$ = s => [...document.querySelectorAll(s)]
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const ago = iso => { if (!iso) return 'never'; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago' }
const today = () => new Date().toISOString().slice(0, 10)
const daysTo = d => Math.floor((Date.parse(d + 'T23:59:59Z') - Date.now()) / 864e5)
let token = sessionStorage.getItem('vendor_token'), view = { page: 'list' }, shownCode = null

async function api(url, body) {
  const r = await fetch('/api/vendor' + url, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (token || '') }, body: body && JSON.stringify(body) })
  const data = await r.json().catch(() => ({}))
  if (r.status === 401 && url !== '/login') { token = null; sessionStorage.removeItem('vendor_token'); render(); throw new Error('Please log in again') }
  if (!r.ok) throw new Error(data.error || 'Request failed')
  return data
}
const go = v => { view = v; shownCode = null; render(); scrollTo(0, 0) }

function loginView() {
  $('#app').innerHTML = `<div class="auth card"><h2>HazelPOS admin</h2><p class="muted">Clients, setups, memberships and health</p>
    <input id="pass" type="password" placeholder="Admin password" autocomplete="current-password"><div class="err" id="err"></div>
    <button class="primary" id="go">Log in</button></div>`
  const login = async () => { try { token = (await api('/login', { password: $('#pass').value })).token; sessionStorage.setItem('vendor_token', token); render() } catch (e) { $('#err').textContent = e.message } }
  $('#go').onclick = login; $('#pass').onkeydown = e => e.key === 'Enter' && login(); $('#pass').focus()
}

function membershipPill(o) {
  if (o.suspended) return '<span class="pill off">Suspended</span>'
  if (!o.paid_until) return '<span class="pill off">Not paid</span>'
  const d = daysTo(o.paid_until)
  if (d < 0) return `<span class="pill off">Ended ${-d} day(s) ago</span>`
  if (d < 5) return `<span class="pill due">Due in ${d} day(s)</span>`
  return '<span class="pill ok">Paid</span>'
}
// Where a branch is in onboarding: set up → activated → setup on the PC → running
function stage(b) {
  const s = b.setup
  if (b.health_at && Date.now() - Date.parse(b.health_at) < 864e5) return s.error ? '<span class="pill off">Setup failed</span>' : '<span class="pill ok">Running</span>'
  if (b.code_used_at) return b.health_at ? '<span class="pill due">Offline</span>' : '<span class="pill info">Activated</span>'
  if (s.menu || s.restaurant) return '<span class="pill info">Setup in progress</span>'
  return '<span class="pill grey">New</span>'
}
const waPill = h => !h?.whatsapp ? '' : h.whatsapp.status === 'connected' ? '<span class="pill ok">WhatsApp on</span>' : `<span class="pill ${h.whatsapp.status ? 'due' : 'grey'}">WhatsApp ${esc(h.whatsapp.status || 'not linked')}</span>`

// ---------- Clients list ----------
async function listView() {
  const owners = await api('/owners')
  const all = owners.flatMap(o => o.branches)
  const sum = k => all.reduce((s, b) => s + (b.ai[k] || 0), 0)
  $('#app').innerHTML = `<header><b>HazelPOS admin</b><span class="sp"></span><button id="logout">Log out</button></header><main>
    <div class="kpis">
      <div class="kpi"><span>Clients</span><b>${owners.length}</b></div>
      <div class="kpi"><span>Paid memberships</span><b>${owners.filter(o => o.active).length}</b></div>
      <div class="kpi"><span>Branches running</span><b>${all.filter(b => b.health_at && Date.now() - Date.parse(b.health_at) < 864e5).length} / ${all.length}</b></div>
      <div class="kpi"><span>Errors (24 h)</span><b>${all.reduce((s, b) => s + b.errors_24h, 0)}</b></div>
      <div class="kpi"><span>AI replies this month</span><b>${sum('calls').toLocaleString()}</b></div>
      <div class="kpi"><span>Tokens in / out</span><b>${(sum('tokens_in') / 1e6).toFixed(2)}M / ${(sum('tokens_out') / 1e6).toFixed(2)}M</b></div>
    </div>
    ${shownCode ? codeCard(shownCode) : ''}
    <details class="card" ${owners.length ? '' : 'open'}><summary><b>New client</b></summary>
      <div class="grid2" style="margin-top:12px">
        <label>Restaurant name<input id="n-name"></label><label>Owner phone<input id="n-phone" inputmode="tel"></label>
        <label>Owner email (their cloud dashboard login)<input id="n-email" type="email"></label><label>Dashboard password (8+ characters)<input id="n-pass"></label>
        <label>Plan<input id="n-plan" placeholder="e.g. Rs 5,000 / month"></label><label>Paid until (empty = one month from today)<input id="n-paid" type="date"></label>
        <label class="wide">Notes<textarea id="n-notes" rows="2"></textarea></label>
        <div class="wide"><div class="err" id="n-err"></div><button class="primary" id="n-go">Add client</button></div>
      </div></details>
    ${owners.map(o => `<div class="card">
      <div class="head"><h3 style="margin:0">${esc(o.name || o.email)}</h3>${membershipPill(o)}<span class="sp"></span><span class="muted">Paid until <b>${esc(o.paid_until || '—')}</b></span></div>
      <div class="muted">${esc(o.email)}${o.phone ? ' · ' + esc(o.phone) : ''}${o.plan ? ' · ' + esc(o.plan) : ''}${o.notes ? ' · ' + esc(o.notes) : ''}</div>
      <div class="scroll"><table><tr><th>Branch</th><th>Stage</th><th>Setup</th><th>Last seen</th><th>Version</th><th>WhatsApp</th><th>Errors 24 h</th><th>AI replies</th><th></th></tr>
        ${o.branches.map(b => `<tr><td><b>${esc(b.name)}</b></td><td>${stage(b)}</td>
          <td class="muted">${b.setup.menu} items · ${b.setup.tables} tables · ${b.setup.staff} staff</td>
          <td>${ago(b.health_at || b.last_sync)}</td><td>${esc(b.health?.version || '—')}</td><td>${waPill(b.health) || '—'}</td>
          <td>${b.errors_24h ? `<span class="pill off">${b.errors_24h}</span>` : '0'}</td><td>${b.ai.calls}</td>
          <td><button class="primary" data-open="${b.id}">Open</button></td></tr>`).join('') || '<tr><td colspan="9" class="muted">No branch yet. Add one to start the setup</td></tr>'}
      </table></div>
      <div class="row">
        <button class="primary" data-extend="${o.id}" data-m="1">Paid: +1 month</button>
        <button data-extend="${o.id}" data-m="3">+3 months</button>
        <button data-date="${o.id}" data-cur="${esc(o.paid_until || today())}">Set date</button>
        <button data-branch="${o.id}">Add branch</button>
        <button class="${o.suspended ? '' : 'danger'}" data-suspend="${o.id}" data-v="${o.suspended ? 0 : 1}">${o.suspended ? 'Resume' : 'Suspend'}</button>
      </div></div>`).join('')}
  </main>`
  $('#logout').onclick = () => { token = null; sessionStorage.removeItem('vendor_token'); render() }
  bindCode()
  $('#n-go').onclick = async () => {
    try { await api('/owners', { name: $('#n-name').value, phone: $('#n-phone').value, email: $('#n-email').value, password: $('#n-pass').value, plan: $('#n-plan').value, paid_until: $('#n-paid').value, notes: $('#n-notes').value }); render() }
    catch (e) { $('#n-err').textContent = e.message }
  }
  const act = fn => async e => { try { await fn(e.currentTarget.dataset); render() } catch (err) { alertBox(err.message) } }
  $$('[data-open]').forEach(b => b.onclick = () => go({ page: 'branch', id: +b.dataset.open }))
  $$('[data-extend]').forEach(b => b.onclick = act(d => api(`/owners/${d.extend}/extend`, { months: +d.m })))
  $$('[data-suspend]').forEach(b => b.onclick = async () => {
    if (b.dataset.v === '1' && !await confirmBoxV('Suspend this client? New orders stop on their POS straight away.')) return
    act(d => api(`/owners/${d.suspend}`, { suspended: d.v === '1' }))({ currentTarget: b })
  })
  $$('[data-branch]').forEach(b => b.onclick = act(async d => { shownCode = await api(`/owners/${d.branch}/branches`, { name: 'Main branch' }) }))
  $$('[data-date]').forEach(b => b.onclick = () => dateBox(b.dataset.cur, async v => { await api(`/owners/${b.dataset.date}`, { paid_until: v }); render() }))
}

function codeCard(c) {
  return `<div class="card"><h3>Activation code for ${esc(c.branch || c.name)}</h3>
    <div class="code">${esc(c.code)}</div>
    <p class="muted">Shown once. Send it to the restaurant: they install HazelPOS and type this code. It works one time; make a new one for a reinstall.</p>
    <button id="code-done">I've noted it</button></div>`
}
const bindCode = () => { if ($('#code-done')) $('#code-done').onclick = () => { shownCode = null; render() } }

// ---------- One branch: setup, activation, health ----------
async function branchView() {
  const d = await api(`/branches/${view.id}/setup`)
  const b = d.branch, s = d.setup, sum = d.summary, h = b.health
  const r = s.restaurant || {}
  const check = (ok, label) => `<span class="pill ${ok ? 'ok' : 'grey'}">${ok ? '✓' : '○'} ${label}</span>`
  $('#app').innerHTML = `<header><button id="back">← Clients</button><b>${esc(b.name)}</b><span class="sp"></span>${stage({ ...b, setup: sum })}</header><main>
    <div class="card"><h3>Onboarding</h3><div class="checks">
      ${check(sum.restaurant, 'Restaurant details')}${check(sum.menu, `Menu (${sum.menu})`)}${check(sum.images, `Menu pictures (${sum.images})`)}
      ${check(sum.tables, `Tables (${sum.tables})`)}${check(sum.zones, `Delivery areas (${sum.zones})`)}${check(sum.staff, `Staff (${sum.staff})`)}
      ${check(b.code_used_at, 'Activated on their PC')}${check(sum.applied_at, 'Setup on their PC')}</div>
      ${sum.error ? `<p class="err">The POS couldn't apply the setup: ${esc(sum.error)}</p>` : ''}
      ${sum.applied_at ? `<p class="muted">Setup applied ${ago(sum.applied_at)}${d.applied ? ` (${Object.entries(d.applied).map(([k, v]) => `${k}: ${esc(v)}`).join(', ')})` : ''}. Changes saved now reach the POS only if it has no orders yet; after that, the restaurant changes things in the POS itself.</p>` : '<p class="muted">Prepare everything here. When the restaurant activates, their POS downloads it.</p>'}
    </div>

    <div class="card"><h3>Activation code</h3>
      ${shownCode ? `<div class="code">${esc(shownCode.code)}</div><p class="muted">Shown once. Send it to the restaurant.</p>` : ''}
      <p class="muted">${b.code_used_at ? `Used ${ago(b.code_used_at)}.` : b.code_created_at ? `Made ${ago(b.code_created_at)}, not used yet.` : 'No code yet.'}
        A new code replaces the old one. When it's used, the PC that used the old one stops working (for a new PC or reinstall).</p>
      <button class="primary" id="new-code">New activation code</button></div>

    <div class="card"><h3>Restaurant details</h3><div class="grid3">
      <label>Name<input id="r-name" value="${esc(r.name)}"></label><label>Phone<input id="r-phone" value="${esc(r.phone)}"></label><label>Logo (emoji)<input id="r-logo" value="${esc(r.logo || '🍽️')}"></label>
      <label class="wide">Address<input id="r-address" value="${esc(r.address)}"></label>
      <label>Tax rate % (empty = none)<input id="r-tax" value="${esc(r.tax_rate)}" inputmode="decimal"></label><label>NTN<input id="r-ntn" value="${esc(r.ntn)}"></label><label>Receipt footer<input id="r-footer" value="${esc(r.footer)}"></label>
    </div><div class="err" id="r-err"></div><button class="primary" id="r-save">Save details</button></div>

    <div class="card"><h3>Menu</h3>
      <p class="muted">${sum.menu ? `${sum.menu} items in ${[...new Set((s.menu || []).map(i => i.category))].length} categories.` : 'No menu yet.'} Upload the restaurant's Excel (one row per item or per size). Uploading again replaces the menu here.</p>
      ${d.menu_upload ? `<div class="row"><button id="m-template">Download template</button><label class="btn primary" style="flex-direction:row;color:#111">Choose Excel file<input id="m-file" type="file" accept=".xlsx,.csv" hidden></label></div>` : '<p class="err">Menu upload is off: deploy the whole repo (cloud/README.md).</p>'}
      <div id="m-preview"></div>
      ${sum.menu ? `<details><summary class="muted">Show the menu</summary><div class="scroll"><table><tr><th>Category</th><th>Item</th><th>Price</th><th>Sizes</th></tr>
        ${(s.menu || []).map(i => `<tr><td>${esc(i.category)}</td><td>${esc(i.emoji || '')} ${esc(i.name)}${i.active ? '' : ' <span class="pill grey">hidden</span>'}</td><td>${i.price}</td><td class="muted">${i.sizes.map(z => `${esc(z.name)} ${z.price}`).join(' · ')}</td></tr>`).join('')}
      </table></div></details>` : ''}</div>

    <div class="card"><h3>Menu pictures</h3><p class="muted">Photos of the menu card (up to 6). The WhatsApp assistant sends them when a customer asks for the menu.</p>
      <label class="btn primary" style="flex-direction:row;color:#111;display:inline-flex">Add pictures<input id="p-file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
      <div class="pics">${d.images.map(im => `<figure><img src="/api/vendor/setup-images/${im.id}?t=${encodeURIComponent(token)}" alt=""><button class="danger" data-delimg="${im.id}">Delete</button></figure>`).join('')}</div></div>

    <div class="grid2">
      <div class="card"><h3>Tables</h3><p class="muted">One per line: <code>name, seats, floor</code></p>
        <div class="row" style="margin-bottom:8px"><input id="t-prefix" placeholder="Prefix" value="T" style="width:80px"><input id="t-count" type="number" placeholder="How many" style="width:110px"><input id="t-floor" placeholder="Floor" value="Main Dining" style="flex:1"><button id="t-gen">Add</button></div>
        <textarea id="t-list" rows="8">${esc((s.tables || []).map(t => `${t.name}, ${t.seats}, ${t.floor}`).join('\n'))}</textarea>
        <div class="err" id="t-err"></div><button class="primary" id="t-save">Save tables</button></div>
      <div class="card"><h3>Delivery areas</h3><p class="muted">One per line: <code>area, fee, minimum order, free above, minutes</code></p>
        <textarea id="z-list" rows="10">${esc((s.zones || []).map(z => `${z.name}, ${z.fee}, ${z.min_order}, ${z.free_above}, ${z.eta_min}`).join('\n'))}</textarea>
        <div class="err" id="z-err"></div><button class="primary" id="z-save">Save delivery areas</button></div>
    </div>

    <div class="card"><h3>Staff and PINs</h3><p class="muted">At least one admin (the owner). PINs are 4–6 digits, all different. Once the POS has them, they're removed from this server.</p>
      <div id="staff">${(s.staff?.length ? s.staff : [{ name: 'Owner', role: 'admin', pin: '' }, { name: 'Cashier', role: 'cashier', pin: '' }, { name: 'Kitchen', role: 'kitchen', pin: '' }]).map(staffRow).join('')}</div>
      <div class="row"><button id="s-add">+ Add person</button><button class="primary" id="s-save">Save staff</button></div><div class="err" id="s-err"></div></div>

    <div class="card"><h3>Health</h3>${h ? `<div class="grid3">
      <div><span class="muted">Last report</span><br><b>${ago(b.health_at)}</b></div><div><span class="muted">Version</span><br><b>${esc(h.version)}</b> <span class="muted">${esc(h.platform)}</span></div>
      <div><span class="muted">Running for</span><br><b>${Math.round((h.uptime_min || 0) / 60)} h</b></div>
      <div><span class="muted">WhatsApp</span><br>${waPill(h)} ${h.whatsapp?.assistant === false ? '<span class="pill grey">assistant off</span>' : ''}${h.whatsapp?.error ? `<br><span class="err">${esc(h.whatsapp.error)}</span>` : ''}</div>
      <div><span class="muted">Orders today</span><br><b>${h.orders_today ?? '—'}</b></div><div><span class="muted">Membership on the POS</span><br><b>${esc(h.licence || '—')}</b></div>
      <div class="wide"><span class="muted">Cloud sync</span><br>last sync ${ago(h.cloud_sync?.last_sync)}, last backup ${ago(h.cloud_sync?.last_backup)}${h.cloud_sync?.pending_orders ? `, ${h.cloud_sync.pending_orders} orders waiting` : ''}${h.cloud_sync?.last_error ? `<br><span class="err">${esc(h.cloud_sync.last_error)}</span>` : ''}</div>
      </div>` : '<p class="muted">No report yet. The POS reports every few hours once it is activated.</p>'}
      <h3 style="margin-top:14px">Errors</h3>${d.errors.length ? `<div class="errlist">${d.errors.map(e => `<div><span class="muted">${esc(e.at.replace('T', ' ').slice(0, 19))}</span>\n${esc(e.text)}</div>`).join('')}</div>` : '<p class="muted">No errors reported.</p>'}
    </div>
  </main>`

  const save = (errId, body) => async () => { try { await api(`/branches/${b.id}/setup`, body()); render() } catch (e) { $(errId).textContent = e.message } }
  $('#back').onclick = () => go({ page: 'list' })
  $('#new-code').onclick = async () => {
    if (b.code_used_at && !await confirmBoxV('Make a new code? When it is used, the PC that is activated now stops working.')) return
    shownCode = await api(`/branches/${b.id}/code`, {}); render()
  }
  $('#r-save').onclick = save('#r-err', () => ({ restaurant: { name: $('#r-name').value, phone: $('#r-phone').value, logo: $('#r-logo').value, address: $('#r-address').value, tax_rate: $('#r-tax').value, ntn: $('#r-ntn').value, footer: $('#r-footer').value } }))
  const lines = id => $(id).value.split('\n').map(l => l.split(',').map(x => x.trim())).filter(p => p[0])
  $('#t-gen').onclick = () => {
    const n = +$('#t-count').value || 0, pre = $('#t-prefix').value.trim(), floor = $('#t-floor').value.trim() || 'Main Dining'
    const add = Array.from({ length: n }, (_, i) => `${pre}${i + 1}, 4, ${floor}`).join('\n')
    $('#t-list').value = ($('#t-list').value.trim() ? $('#t-list').value.trim() + '\n' : '') + add
  }
  $('#t-save').onclick = save('#t-err', () => ({ tables: lines('#t-list').map(([name, seats, floor]) => ({ name, seats: +seats || 4, floor: floor || 'Main Dining' })) }))
  $('#z-save').onclick = save('#z-err', () => ({ zones: lines('#z-list').map(([name, fee, min_order, free_above, eta_min]) => ({ name, fee: +fee || 0, min_order: +min_order || 0, free_above: +free_above || 0, eta_min: +eta_min || 45 })) }))
  $('#s-add').onclick = () => $('#staff').insertAdjacentHTML('beforeend', staffRow({ name: '', role: 'cashier', pin: '' }))
  $('#staff').onclick = e => { if (e.target.matches('[data-delstaff]')) e.target.closest('.staff-row').remove() }
  $('#s-save').onclick = save('#s-err', () => ({ staff: $$('.staff-row').map(r => ({ name: r.querySelector('.s-name').value, role: r.querySelector('.s-role').value, pin: r.querySelector('.s-pin').value })) }))
  $$('[data-delimg]').forEach(x => x.onclick = async () => { await api(`/setup-images/${x.dataset.delimg}/delete`, {}); render() })
  $('#p-file').onchange = async e => {
    try { for (const f of e.target.files) await api(`/branches/${b.id}/setup/images`, { data: await shrink(f) }) } catch (err) { alertBox(err.message) }
    render()
  }
  if (d.menu_upload) {
    $('#m-template').onclick = async () => {
      const rows = await api('/menu-template')
      const csv = rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\r\n')
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })), download: 'hazelpos-menu-template.csv' })
      a.click()
    }
    $('#m-file').onchange = e => {
      const f = e.target.files[0]; if (!f) return
      const rd = new FileReader()
      rd.onload = async () => {
        const file = String(rd.result).split(',')[1], name = f.name
        try {
          const p = await api(`/branches/${b.id}/setup/menu`, { file, name })
          $('#m-preview').innerHTML = `<div class="card" style="background:var(--panel2)"><p><b>${p.items}</b> items in <b>${p.categories.length}</b> categories: ${p.categories.map(esc).join(', ')}</p>
            ${p.errors.length ? `<div class="err">Fix these rows in the file and choose it again:<br>${p.errors.map(x => `Row ${x.row}: ${esc(x.error)}`).join('<br>')}</div>`
              : `<p class="muted">First items: ${p.sample.map(i => `${esc(i.name)} (${i.sizes.length ? i.sizes.map(z => `${esc(z.name)} ${z.price}`).join('/') : i.price})`).join(', ')}</p><button class="primary" id="m-save">Save this menu</button>`}</div>`
          if ($('#m-save')) $('#m-save').onclick = async () => { await api(`/branches/${b.id}/setup/menu`, { file, name, apply: true }); render() }
        } catch (err) { $('#m-preview').innerHTML = `<p class="err">${esc(err.message)}</p>` }
      }
      rd.readAsDataURL(f)
    }
  }
}
const staffRow = u => `<div class="staff-row"><input class="s-name" placeholder="Name" value="${esc(u.name)}">
  <select class="s-role">${['admin', 'cashier', 'kitchen'].map(r => `<option ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
  <input class="s-pin" placeholder="${u.pin_applied ? 'set on the POS' : 'PIN'}" value="${esc(u.pin || '')}" inputmode="numeric" maxlength="6">
  <button class="danger" data-delstaff aria-label="Remove">✕</button></div>`

// Phone photos are shrunk before upload (max 1600 px, JPEG)
const shrink = file => new Promise((resolve, reject) => {
  const img = new Image()
  img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) }); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL('image/jpeg', 0.85)) }
  img.onerror = () => reject(new Error('That file is not a picture'))
  img.src = URL.createObjectURL(file)
})
// Small in-page boxes instead of the browser's alert/confirm/prompt
function box(html) { const d = document.createElement('dialog'); d.innerHTML = html; document.body.append(d); d.showModal(); return d }
function alertBox(msg) { const d = box(`<p>${esc(msg)}</p><button>OK</button>`); d.querySelector('button').onclick = () => d.remove() }
function confirmBoxV(msg) { return new Promise(res => { const d = box(`<p>${esc(msg)}</p><div class="row"><button class="danger">Yes</button><button>Cancel</button></div>`); const [y, n] = d.querySelectorAll('button'); y.onclick = () => { d.remove(); res(true) }; n.onclick = () => { d.remove(); res(false) } }) }
function dateBox(cur, done) {
  const d = box(`<p>Paid until</p><input type="date" value="${esc(cur)}"><div class="err"></div><div class="row"><button class="primary">Save</button><button>Cancel</button></div>`)
  const [save, cancel] = d.querySelectorAll('button')
  cancel.onclick = () => d.remove()
  save.onclick = async () => { try { await done(d.querySelector('input').value); d.remove() } catch (e) { d.querySelector('.err').textContent = e.message } }
}

async function render() {
  if (!token) return loginView()
  try { view.page === 'branch' ? await branchView() : await listView(); bindCode() } catch (e) { if (token) alertBox(e.message) }
}
render()
</script>
</body>
